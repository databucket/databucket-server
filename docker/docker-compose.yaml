# Local Databucket with single sign-on through Keycloak, behind a Caddy reverse proxy.
#
#   cd docker && docker compose up --build
#
# Databucket: http://databucket.localhost   (user super / super)
# Keycloak:   http://auth.localhost         (admin / admin, realm "databucket")
# Mailpit:    http://mail.localhost         (every email Databucket sends lands here)
#
# *.localhost resolves to this machine in the browser. Inside the compose network both names resolve to
# Caddy, so Databucket reaches Keycloak at the same address as the browser (the OIDC issuer must match).
#
# To try SSO: sign in to Databucket as super, give a user the email demo@databucket.localhost and
# assign a project, then use "Sign in with Keycloak" as demo / demo.
#
# A robot without a password: create a ROBOT user named tests-robot with a project, then get a client token
# from Keycloak and exchange it for a Databucket token (see the wiki page Single sign-on, Robots):
#   curl -d grant_type=client_credentials -d client_id=tests-robot -d client_secret=tests-robot-secret \
#        http://auth.localhost/realms/databucket/protocol/openid-connect/token
#   curl -H "Content-Type: application/json" -d '{"token": "<access_token>"}' \
#        http://databucket.localhost/api/public/sso/token-exchange
# To switch the password sign-in off: SSO_PASSWORD_LOGIN=false docker compose up -d
#
# Self-registration is on: signing in with Keycloak as a user without a Databucket account (e.g. stranger / stranger)
# offers to create one; the SUPER admins (with an email) get a message in Mailpit. Off: SSO_SELF_REGISTRATION=false
#
# Your own PostgreSQL (e.g. installed on this machine, to see the data in pgAdmin): put into docker/.env
#   DATABUCKET_DB_URL=jdbc:postgresql://host.docker.internal:5432/<database>
#   DATABUCKET_DB_USER=<user>
#   DATABUCKET_DB_PASSWORD=<password>
# and run "docker compose up -d databucket". Use a database only for this compose. To copy data into it, restore
# the copy before Databucket starts on it (wiki: Installation, Copying the database).
#
# Logs in Kibana (Elasticsearch + Kibana + Filebeat): see docker-compose.elastic.yaml.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: databucket_user
      POSTGRES_PASSWORD: databucket_user
      POSTGRES_DB: databucket
    # not published, so it doesn't clash with a local PostgreSQL; use: docker compose exec postgres psql -U databucket_user databucket
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databucket_user -d databucket"]
      interval: 5s
      timeout: 5s
      retries: 10

  databucket:
    build:
      context: ..
      dockerfile: docker/Dockerfile.build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # the database of this compose by default; a PostgreSQL on this machine: see "Your own PostgreSQL" at the top
      SPRING_DATASOURCE_URL: ${DATABUCKET_DB_URL:-jdbc:postgresql://postgres:5432/databucket}
      SPRING_DATASOURCE_USERNAME: ${DATABUCKET_DB_USER:-databucket_user}
      SPRING_DATASOURCE_PASSWORD: ${DATABUCKET_DB_PASSWORD:-databucket_user}
      SSO_ENABLED: "true"
      SSO_PROVIDER: keycloak
      SSO_ISSUER_URI: http://auth.localhost/realms/databucket
      SSO_CLIENT_ID: databucket
      SSO_CLIENT_SECRET: databucket-secret
      SSO_PASSWORD_LOGIN: ${SSO_PASSWORD_LOGIN:-true}
      SSO_SELF_REGISTRATION: ${SSO_SELF_REGISTRATION:-true}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://auth.localhost
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/databucket-realm.json:/opt/keycloak/data/import/databucket-realm.json:ro

  mailpit:
    image: axllent/mailpit:v1.27

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - databucket
      - keycloak
      - mailpit
    networks:
      default:
        aliases:
          - databucket.localhost
          - auth.localhost

volumes:
  postgres-data:
