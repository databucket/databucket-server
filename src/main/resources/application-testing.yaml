# Local profile "testing" (H2, security autoconfiguration excluded): not packed into the jar (build.gradle).
jwt:
  secret: local-testing-profile-only-not-in-the-jar-never-use-it-anywhere
  expire.hours: 24

server:
  port: 8080
  servlet.context-path: /

recaptcha:
  enabled: false
  siteKey: yourSiteKey
  secretKey: yourSecretKey

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/databucket
    username: databucket_user
    password: databucket_user
  mail:
    host: smtp.gmail.com
    port: 587
    username: username
    password: password
    from: admin@email.io
    properties.mail.smtp.auth: true
    properties.mail.smtp.starttls.enable: true

logging:
  level:
    root: info
    org.springframework.web: error
#    org.hibernate: error
#    org.hibernate.SQL: debug
#    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    pl.databucket.server.service.data: debug
    pl.databucket.server.service.BucketService: info
