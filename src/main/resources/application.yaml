databucket:
  # Upper bound on requests served at once. Both the Tomcat worker threads and the Hikari pool are
  # sized from it, so threads do not compete for connections: requests over the limit queue in Tomcat
  # (server.tomcat.accept-count) instead. A request holds a connection only inside a transaction, so
  # the threads may be raised above the pool later if requests spend time outside the database.
  max-concurrent-requests: 30

spring:
  application:
    # service.name in the ECS (JSON) logs
    name: databucket
  jpa:
    generate-ddl: true
    hibernate.ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${databucket.max-concurrent-requests}
      minimum-idle: 10
      # Logs the stack trace of whatever borrowed a connection and did not give it back in time.
      # Purely diagnostic: nothing is closed or reclaimed. The threshold sits far above a normal
      # request, which answers in milliseconds, so it stays silent until something is stuck.
      leak-detection-threshold: 20000
  sql:
    init:
      mode: always
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
  main:
    allow-circular-references: true

server:
  tomcat:
    threads:
      max: ${databucket.max-concurrent-requests}
    accept-count: 50

management:
  health:
    # The mail indicator logs in to the SMTP server on every health call. With placeholder
    # credentials that only fails, and repeated failures get the host rate-limited by the provider.
    mail:
      enabled: false

recaptcha:
  enabled: false
  siteKey: yourSiteKey
  secretKey: yourSecretKey

logging:
  # Text by default. On servers (k8s -> Elastic) set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs to get one ECS JSON
  # object per line; the MDC fields (http.request.id, user.name, databucket.project.id, ...) are included.
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %highlight{%-5level} [%t] %style{%c{1.}}{yellow}%style{%notEmpty{ req=%X{http.request.id}}%notEmpty{ user=%X{user.name}}%notEmpty{ project=%X{databucket.project.id}}}{cyan}: %m%n%throwable"
  # Levels can be overridden per environment, e.g. LOGGING_LEVEL_PL_DATABUCKET_SERVER_ACCESS=warn
  level:
    root: info
    # One line per /api request: method, path, status, duration, client.
    # access.data covers bucket data (/api/bucket/**: rows, reservations, history), most of the traffic.
    pl.databucket.server.access: info
    pl.databucket.server.access.data: info
    # Significant operations, one logger per area: audit.auth, audit.data, audit.bucket, audit.user, ...
    pl.databucket.server.audit: info
    pl.databucket.server.audit.data: info
    # SQL built for bucket data, with its parameters (which include data values); debug to see it
    pl.databucket.server.service.data: info
    pl.databucket.server.service.BucketService: info