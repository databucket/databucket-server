plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot' version '3.5.12'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'pl.databucket'
version = '3.7.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    configureEach {
        exclude module: 'spring-boot-starter-logging'
    }
}

repositories {
    mavenCentral()
}

jar {
    enabled = false
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    implementation 'org.postgresql:postgresql:42.7.10'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'org.modelmapper:modelmapper:3.2.6'
    implementation 'com.lmax:disruptor:4.0.0'
    implementation 'commons-io:commons-io:2.21.0'

    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok'

    // Spock Framework + Groovy for testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.spockframework:spock-bom:2.4-M4-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.spockframework:spock-spring'
    testImplementation 'org.apache.groovy:groovy:4.0.24'
    testRuntimeOnly 'com.h2database:h2:2.2.224'
}

test {
    useJUnitPlatform()
    addTestListener(new TestListener() {
        void beforeSuite(TestDescriptor desc) {}
        void beforeTest(TestDescriptor desc) {}
        void afterTest(TestDescriptor desc, TestResult result) {}
        void afterSuite(TestDescriptor desc, TestResult result) {
            if (!desc.parent) {
                println("${result.resultType} " +
                        "(${result.testCount} tests, " +
                        "${result.successfulTestCount} successes, " +
                        "${result.failedTestCount} failures, " +
                        "${result.skippedTestCount} skipped)")
            }
        }
    })
}

import com.github.gradle.node.npm.task.NpmTask
import groovy.json.JsonSlurper

tasks.register('deleteStatic') {
    doLast {
        delete "src/main/resources/static"
    }
}

// Gradle downloads its own Node.js, so the build does not depend on the version installed on the machine
node {
    // set() instead of an assignment: CI greps build.gradle for the app version assignment
    version.set('22.23.4')
    // npm 10 bundled with Node 22 rewrites package-lock.json generated by npm 11
    npmVersion = '11.19.1'
    download = true
    nodeProjectDir = file('frontend')
}

// On Alpine (musl), even with a glibc compatibility layer, the native bindings of the frontend build tools
// (rolldown, lightningcss) don't load with the Node.js above. There rolldown runs as WebAssembly and CSS is not
// minified (Vite minifies it with lightningcss, which has no WebAssembly build). Slower build, the same application.
boolean wasmFrontend = file('/etc/alpine-release').exists()

tasks.register('installFrontend', NpmTask) {
    args = ['install']
}

tasks.register('installRolldownWasm', NpmTask) {
    dependsOn tasks.named('installFrontend')
    onlyIf { wasmFrontend }
    // One install (another one would remove these packages again): the binding of the same version as rolldown and
    // its dependencies in their lowest allowed versions, because a newer @napi-rs/wasm-runtime doesn't work with
    // the @emnapi version the binding uses. --force: the binding is meant for another platform (wasm32);
    // --no-save: package.json and package-lock.json stay unchanged.
    // (the variable is not called just "version": the CI pipeline greps the application version line of this file)
    args.set(providers.provider {
        def rolldownVersion = new JsonSlurper().parse(file('frontend/node_modules/rolldown/package.json')).version
        def binding = new JsonSlurper().parse(new URL("https://registry.npmjs.org/@rolldown%2Fbinding-wasm32-wasi/${rolldownVersion}"))
        ['install', '--no-save', '--force', "@rolldown/binding-wasm32-wasi@${rolldownVersion}".toString()] +
                binding.dependencies.collect { name, range -> "${name}@${range.replaceAll(/^[\^~]/, '')}".toString() }
    })
}

tasks.register('buildFrontend', NpmTask) {
    dependsOn tasks.named('installRolldownWasm')
    args = ['run', 'build']
    if (wasmFrontend)
        environment = ['NAPI_RS_FORCE_WASI': '1', 'DATABUCKET_CSS_MINIFY': 'false']
}

tasks.register('copyFrontend') {
    dependsOn tasks.named('buildFrontend')

    doLast {
        copy {
            from "frontend/build"
            into "src/main/resources/static"
        }
    }
}

tasks.named("clean") {
    dependsOn tasks.named("deleteStatic")
}

tasks.named("compileJava") {
    dependsOn tasks.named("copyFrontend")
    mustRunAfter tasks.named("clean")
}
springBoot {
    buildInfo()
}
